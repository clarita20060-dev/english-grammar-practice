<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Present Perfect Active & Passive · A2</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#152d4b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:870px;margin:auto;padding:24px 15px 70px}.hero{background:linear-gradient(125deg,#173e80,#337ac1);color:white;padding:28px;border-radius:20px}.hero h1{font-size:clamp(25px,5vw,36px);margin:0 0 7px}.hero p{margin:0;opacity:.92}.formula{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.pill{background:#ffffff20;border:1px solid #ffffff55;border-radius:10px;padding:10px 14px;font-weight:650}.card{background:white;border:1px solid #dce6f3;border-radius:18px;margin-top:18px;padding:22px;box-shadow:0 4px 15px #132f5408}h2{font-size:21px;margin:0 0 5px}.intro{color:#516985;font-size:14px;margin:0 0 19px}.question{border-top:1px solid #edf1f7;padding:14px 0}.question:first-of-type{border-top:0}.qline{font-weight:600;margin-bottom:9px;line-height:1.6}.choices{display:flex;flex-wrap:wrap;gap:8px}.option{display:inline-flex;gap:7px;align-items:center;border:1px solid #d5e1f2;padding:8px 11px;border-radius:10px;cursor:pointer;background:#f9fbfe}.option:has(input:checked){border-color:#337ac1;background:#e8f1ff}input[type=text]{display:block;width:100%;max-width:630px;border:1px solid #bfcee0;border-radius:10px;padding:12px;font:inherit;margin-top:6px}input[type=radio]{accent-color:#2868b3}.feedback{font-size:14px;margin-top:9px;padding:8px 10px;border-radius:8px;display:none}.feedback.good{display:block;color:#11613f;background:#e9f8ef}.feedback.bad{display:block;color:#8b3030;background:#fff0ef}.actions{position:sticky;bottom:0;background:#f4f7fcef;padding:15px 0;display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}#check{background:#2568b3;color:white}#reset{background:#e5ecf5;color:#254467}#result{background:#e7f7ed;border:1px solid #a5dec1;border-radius:14px;padding:18px;display:none;margin-top:15px}small{color:#607794}.section-number{display:inline-flex;background:#e9f2ff;color:#2167ac;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;margin-right:6px}@media(max-width:600px){.card{padding:16px}.option{flex:1 1 110px}.hero{padding:20px}.actions button{flex:1}}</style></head><body><main><header class="hero"><h1>Present Perfect: Active & Passive</h1><p>Practice Trainer · Level A2 · Grade 9</p><div class="formula"><div class="pill">ACTIVE: have / has + V3</div><div class="pill">PASSIVE: have / has + been + V3</div></div></header><div id="tasks"></div><div id="result" role="status" aria-live="polite"></div><div class="actions"><button id="check">Check answers</button><button id="reset">Try again</button></div><small>Practice independently. Answers are checked on this device; they are not sent to the teacher.</small></main><script>
const sections=[{title:'Active or Passive?',intro:'Read each sentence and choose Active or Passive.',type:'choice',items:[['She has finished her homework.',['Active','Passive'],0],['The window has been broken.',['Active','Passive'],1],['They have cleaned the kitchen.',['Active','Passive'],0],['The letters have been sent.',['Active','Passive'],1],['My brother has bought a new bike.',['Active','Passive'],0],['The cake has been made.',['Active','Passive'],1]]},{title:'Choose the correct form',intro:'Choose the correct answer.',type:'choice',items:[['Tom ___ already washed the car.',['have','has','has been'],1],['The door ___ just been opened.',['have','has','is'],1],['They ___ finished the project.',['have','has','have been'],0],['The books have ___ put on the table.',['be','been','being'],1],['My phone ___ been repaired.',['have','has','is'],1],['She has ___ an email.',['write','wrote','written'],2]]},{title:'Complete the sentences',intro:'Put the verbs in brackets into Present Perfect Active or Passive.',type:'text',items:[['I ___ (finish) my homework.','have finished'],['The room ___ (clean).','has been cleaned'],['They ___ (buy) new computers.','have bought'],['The windows ___ (wash).','have been washed'],['She ___ (write) three emails.','has written'],['The dinner ___ (cook).','has been cooked']]},{title:'Change Active into Passive',intro:'Rewrite the sentences using Present Perfect Passive. Example: Mum has cooked dinner. → Dinner has been cooked.',type:'text',items:[['They have cleaned the classroom.','The classroom has been cleaned.'],['Tom has opened the door.','The door has been opened.'],['She has written a letter.','A letter has been written.'],['The children have broken two windows.','Two windows have been broken.'],['They have built a new school.','A new school has been built.']]},{title:'Find and correct the mistake',intro:'Each sentence contains one mistake. Rewrite it correctly.',type:'text',items:[['The letter has sent.','The letter has been sent.'],['She have finished her homework.','She has finished her homework.'],['The car has been wash.','The car has been washed.'],['They have been bought a new TV.','They have bought a new TV.'],['Has the books been delivered?','Have the books been delivered?']]}];
const tasks=document.getElementById('tasks');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let k=0;sections.forEach((section,s)=>{let html=`<section class="card"><h2><span class="section-number">${s+1}</span>${escapeHtml(section.title)}</h2><p class="intro">${escapeHtml(section.intro)}</p>`;section.items.forEach((item,i)=>{const id=k++;html+=`<div class="question" data-id="${id}" data-section="${s}" data-index="${i}"><div class="qline">${i+1}. ${escapeHtml(item[0])}</div>`;if(section.type==='choice'){html+='<div class="choices">'+item[1].map((o,j)=>`<label class="option"><input type="radio" name="q${id}" value="${j}">${escapeHtml(o)}</label>`).join('')+'</div>'}else{html+=`<input type="text" aria-label="Answer ${i+1}" autocomplete="off" placeholder="Write your answer...">`}html+='<div class="feedback" aria-live="polite"></div></div>'});html+='</section>';tasks.insertAdjacentHTML('beforeend',html)});
function normalize(s){return String(s).toLowerCase().replace(/[’]/g,"'").replace(/[.!?]/g,'').replace(/\s+/g,' ').trim()}document.getElementById('check').onclick=()=>{let total=0,correct=0,answered=0;document.querySelectorAll('.question').forEach(q=>{const s=Number(q.dataset.section),i=Number(q.dataset.index),section=sections[s],item=section.items[i],f=q.querySelector('.feedback');let valid,answer,filled;if(section.type==='choice'){const sel=q.querySelector('input:checked');filled=!!sel;valid=filled&&Number(sel.value)===item[2];answer=item[1][item[2]]}else{const val=q.querySelector('input[type=text]').value;filled=!!val.trim();valid=filled&&normalize(val)===normalize(item[1]);answer=item[1]}total++;if(filled)answered++;if(valid)correct++;f.className='feedback '+(valid?'good':'bad');f.textContent=valid?'✓ Correct!':`✗ Correct answer: ${answer}`});const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<strong style="font-size:24px">${correct} / ${total} correct</strong><p style="margin-bottom:0">Answered: ${answered} / ${total}. Review the corrections above, then try again.</p>`;r.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('reset').onclick=()=>{document.querySelectorAll('input').forEach(x=>{if(x.type==='radio')x.checked=false;else x.value=''});document.querySelectorAll('.feedback').forEach(x=>x.className='feedback');document.getElementById('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
